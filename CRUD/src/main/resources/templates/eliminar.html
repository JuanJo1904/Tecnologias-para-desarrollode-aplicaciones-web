<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Dispositivo</title>
</head>
<body>

<h1>Eliminar Dispositivo</h1>

<form th:action="@{/dispositivos/borrar}" method="post">

    <input type="hidden" name="id" th:value="${dispositivo.id}">

    <p>¿Seguro que deseas eliminar el dispositivo?</p>

    <p th:text="${dispositivo.nombre}"></p>

    <button type="submit">Eliminar</button>

    <a href="/dispositivos">Cancelar</a>

</form>

</body>
</html>
